[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "asterust"
dynamic = ["version"]
description = "Hierarchical network device config parsing with typed platform views (IOS XR)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]

[project.optional-dependencies]
test = ["pytest"]

[tool.maturin]
module-name = "asterust._core"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
