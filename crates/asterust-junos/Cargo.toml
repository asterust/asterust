[package]
name = "asterust-junos"
version = "0.3.9"
edition = "2021"
description = "Typed Juniper JunOS config views (interfaces, OSPF, BGP, IS-IS, routing instances, policy options, firewall filters, system) extracted from an asterust config tree."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/asterust/asterust"

[lib]
name = "asterust_junos"

[dependencies]
asterust = { path = "../..", version = "0.2.6" }
