[package]
name = "asterust"
version = "0.1.0"
edition = "2021"
description = "Reusable parsing primitives for network device CLI output (prompts, timestamp banners, terminal artifact cleanup, path sanitization)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/asterust/asterust"

[lib]
name = "asterust"

[dependencies]
regex = "1"
once_cell = "1"
